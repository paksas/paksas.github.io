- dates: "2023 — present"
  title: "Entrepreneur"
  body: |
    Building AI-first companies. Director of ML at Pavo AI; founding member of the AI
    Incubator at the [Tony Blair Institute](https://institute.global/); Head of ML Ops at
    the [Ellison Institute of Technology](https://eit.org/), Oxford; co-founder and VP of
    Applied Research at Leapfrog Studios.

- dates: "2017 - 2023"
  title: "Deep Learning"
  body: |
    Built ML infrastructure and shipped research at [DeepMind](https://deepmind.google/)
    and [Meta](https://meta.com/). At DeepMind, tech lead across model-based RL, robot
    perception, causal reasoning, and the simulator infrastructure behind BCOOLER. At
    Meta, Uber-Tech Lead for online experimentation infrastructure powering Ads Ranking.

- dates: "2008 - 2016"
  title: "Embodied Intelligence for Games"
  body: |
    Animation, AI, and physics for games. Senior Gameplay/AI Programmer at CD Projekt RED
    on _The Witcher 2_; Senior Software Engineer at Havok building character and vehicle
    libraries used across the games industry; Crytek Frankfurt on the locomotion of the
    dinosaurs in _Robinson the Journey_ (VR).

- dates: "2005 - 2008"
  title: "Discovering Software Engineering"
  body: |
    First professional roles. Software Engineer at Motorola working on a Tetra-standard
    packet data router. Later at Sabre Holdings, on next-generation data-mining
    architecture and mentoring teams on TDD and OOAD.
