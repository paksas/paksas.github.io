- dates: "2024 - 2025"
  org: "Ellison Institute of Technology"
  org_url: "https://eit.org/"
  role: "Head of ML Ops (founding member, AI & Data team)"
  body: |
    Founding member of the horizontal AI & Data team that enabled all of EIT's ML and AI
    efforts across its four domains: medical sciences, climate, agriculture & sustainability,
    and government efficiency. Defined the institute's ML infrastructure strategy, built the
    engineering team, and managed the partnership with Oracle.

- dates: "2023 - 2024"
  org: "Leapfrog Studios"
  role: "VP Applied Research, Co-founder"
  body: |
    Co-founded a studio applying machine learning to invent new ways for video games to
    engage players. Historically, gaming innovation has tracked hardware cycles; this is
    the first era where algorithmic innovation alone offers a comparable opportunity. Grew
    and led a team of research scientists and engineers exploring the space.

- dates: "2022 - 2023"
  org: "Meta"
  org_url: "https://meta.com/"
  role: "Staff Software Engineer, Ads"
  body: |
    Uber-Tech Lead for the online experimentation infrastructure underpinning Ads Ranking,
    leading 20 engineers across six projects spanning statistical research and full-stack
    engineering. Tackled experiment correctness in the face of effects below the platform's
    detectability threshold, p-hacking-friendly UX, and feedback-loop confounders. Earned
    "Greatly Exceeds Expectations" for unblocking ~50% more model innovation than originally
    planned.

- dates: "2017 - 2022"
  org: "DeepMind"
  org_url: "https://deepmind.google/"
  role: "Senior Software Engineer"
  body: |
    Tech lead and infrastructure builder across multiple research projects: distributed
    training infrastructure for model-based RL agents on continuous-control environments;
    a third-party-tech adoption framework that cut multi-week onboarding to hours;
    large-scale supervised-learning data collection from specialized scientific simulators;
    3D environment suites for robot perception and causal-reasoning research. Co-author of
    [_Using Unity to Help Solve Intelligence_](https://arxiv.org/abs/2011.09294) and
    maintainer of the [DeepMind Control Suite](https://github.com/google-deepmind/dm_control)
    visualizer.

- dates: "2016 - 2017"
  org: "Botperfect & Crytek"
  role: "Founder, contractor"
  body: |
    Brief stint at Crytek Frankfurt building the locomotion system for the dinosaurs in
    _Robinson the Journey_ (VR) — bipedal anatomy with a long, snake-like tail required
    blending traditional bipedal techniques with serpentine motion. Otherwise running my
    own consultancy: a Kanban task manager for accountancy offices, plus contract work on
    _Hatred_ (UE4 prototype) and a virtual battlefield simulation handling 5000+ units
    on screen.

- dates: "2011 - 2015"
  org: "Havok"
  role: "Senior Software Engineer (Dublin & Warsaw)"
  body: |
    Built character and vehicle libraries ready for immediate deployment in client
    simulations. Designed parametric blend trees for locomotion, aiming, and pose-on-demand;
    integrated them with Havok AI for navigation; built a velocity-domain animation
    synchronizer that eliminated artifacts from time-based warping; implemented the ragdoll
    system and pose-driving controllers for the new physics library; designed the content
    authoring pipeline for 3ds Max and Maya.

- dates: "2009 - 2011"
  org: "CD Projekt RED"
  role: "Senior Gameplay / AI Programmer"
  body: |
    Worked on _The Witcher 2_ (PC and Xbox 360). Built the non-linear quest authoring system
    — a visual block language similar to Unreal Blueprints that orchestrated every gameplay
    system in RedEngine and was used end-to-end by writers and designers. Integrated
    PathEngine navigation with the in-house animation system, designed kinematic constraints
    for obstacle avoidance and docking, and worked on engine systems including game-saves
    integrated with the realtime scripting language and world streaming.

- dates: "2008 - 2009"
